name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  knip:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Dead-code and unused-export check
        run: npm run knip

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Cache TypeScript build
        uses: actions/cache@v4
        with:
          path: dist
          key: tsc-${{ runner.os }}-${{ hashFiles('src/**/*.ts', 'tsconfig.json') }}
          restore-keys: |
            tsc-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build check
        run: npm run build

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Run tests with coverage
        env:
          OMOPHUB_API_KEY: ${{ secrets.OMOPHUB_API_KEY }}
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/book-of-ohdsi/coverage/
            packages/ohdsi-weekly-digest/coverage/
            packages/omop-cdm/coverage/

  coverage-report:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    permissions:
      pull-requests: write

    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Generate coverage report comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const fmt = (pct) => `${pct.toFixed(2)}%`;

            function findSummaries(root) {
              const results = [];
              if (!fs.existsSync(root)) return results;
              for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
                const full = path.join(root, entry.name);
                if (entry.isDirectory()) {
                  results.push(...findSummaries(full));
                } else if (entry.name === 'coverage-summary.json') {
                  results.push(full);
                }
              }
              return results;
            }

            const summaries = findSummaries('coverage').sort();
            if (summaries.length === 0) {
              console.log('No coverage summaries found');
              return;
            }

            const sections = summaries.map((file) => {
              const summary = JSON.parse(fs.readFileSync(file, 'utf8'));
              const total = summary.total;
              const pkg =
                file
                  .replace(/^coverage\//, '')
                  .replace(/\/coverage\/coverage-summary\.json$/, '')
                  .replace(/^packages\//, '') || 'root';
              const fileRows = Object.entries(summary)
                .filter(([key]) => key !== 'total')
                .map(([f, data]) => {
                  const name = f.replace(process.cwd() + '/', '');
                  return `| ${name} | ${fmt(data.statements.pct)} | ${fmt(data.branches.pct)} | ${fmt(data.functions.pct)} | ${fmt(data.lines.pct)} |`;
                })
                .join('\n');
              return `
            ### \`${pkg}\`

            | Metric | Coverage |
            |--------|----------|
            | Statements | ${fmt(total.statements.pct)} |
            | Branches | ${fmt(total.branches.pct)} |
            | Functions | ${fmt(total.functions.pct)} |
            | Lines | ${fmt(total.lines.pct)} |

            <details>
            <summary>File breakdown</summary>

            | File | Statements | Branches | Functions | Lines |
            |------|------------|----------|-----------|-------|
            ${fileRows}

            </details>
            `;
            });

            const table = `## Coverage Report\n${sections.join('\n')}`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## Coverage Report')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: table,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: table,
              });
            }
