name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Cache TypeScript build
        uses: actions/cache@v4
        with:
          path: dist
          key: tsc-${{ runner.os }}-${{ hashFiles('src/**/*.ts', 'tsconfig.json') }}
          restore-keys: |
            tsc-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build check
        run: npm run build

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        env:
          OMOPHUB_API_KEY: ${{ secrets.OMOPHUB_API_KEY }}
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  coverage-report:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Generate coverage report comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read coverage summary
            const summaryPath = 'coverage/coverage-summary.json';
            if (!fs.existsSync(summaryPath)) {
              console.log('Coverage summary not found');
              return;
            }

            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            const total = summary.total;

            // Format percentage
            const fmt = (pct) => `${pct.toFixed(2)}%`;

            // Build markdown table
            const table = `
            ## Coverage Report

            | Metric | Coverage |
            |--------|----------|
            | Statements | ${fmt(total.statements.pct)} |
            | Branches | ${fmt(total.branches.pct)} |
            | Functions | ${fmt(total.functions.pct)} |
            | Lines | ${fmt(total.lines.pct)} |

            <details>
            <summary>File breakdown</summary>

            | File | Statements | Branches | Functions | Lines |
            |------|------------|----------|-----------|-------|
            ${Object.entries(summary)
              .filter(([key]) => key !== 'total')
              .map(([file, data]) => {
                const name = file.replace(process.cwd() + '/', '');
                return `| ${name} | ${fmt(data.statements.pct)} | ${fmt(data.branches.pct)} | ${fmt(data.functions.pct)} | ${fmt(data.lines.pct)} |`;
              })
              .join('\n')}

            </details>
            `;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## Coverage Report')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: table,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: table,
              });
            }
